  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; }
  header { padding:14px 20px 10px; border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:0 0 4px; }

  main { flex:1; display:flex; min-height:0; }
  #stage { flex:1; position:relative; min-width:0; }
  svg { width:100%; height:100%; display:block; cursor:grab; touch-action:none; }

  .edge { stroke:var(--edge); stroke-width:1; vector-effect:non-scaling-stroke; }
  .edge.inf { stroke-dasharray:4 3; }
  .edge.hl { stroke:var(--accent); stroke-width:2; vector-effect:non-scaling-stroke; }
  .node circle { stroke-width:1.5; vector-effect:non-scaling-stroke; cursor:pointer; }
  .node text { font-size:var(--fs, 11px); fill:var(--ink); pointer-events:none; paint-order:stroke; stroke:var(--bg); stroke-width:3px; }
  .node.minor text { display:none; }
  svg.zoomed .node.minor text { display:inline; }
  .node.sel circle { stroke:var(--ink); stroke-width:3; }
  .dim { opacity:.12; }
  .hidden { display:none; }
  .controls { position:absolute; left:12px; top:12px; display:flex; gap:6px; }
  .controls button { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:5px 10px; font-size:13px; cursor:pointer; }
  aside { width:330px; flex:none; border-left:1px solid var(--line); background:var(--panel); padding:12px 14px; overflow:auto; font-size:13px; }
  input[type=search] { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); font-size:13px; }
  .lg { display:flex; align-items:center; gap:8px; margin:4px 0; cursor:pointer; user-select:none; }
  .lg.off { opacity:.35; }
  .dot { width:11px; height:11px; border-radius:50%; flex:none; }
  h2 { font-size:15px; margin:14px 0 4px; }
  .meta, .hint { color:var(--quiet); font-size:12px; }
  ul { padding-left:16px; margin:6px 0; }
  li { margin:3px 0; cursor:pointer; }
  li:hover { color:var(--accent); }
  @media (max-width:800px) { main { flex-direction:column; } aside { width:auto; height:45vh; border-left:none; border-top:1px solid var(--line); } }
</style>

upport_step", "l": "Support step: the bracelet pulses only when the reading is sure the person is tense, tuned to their heart and breathing; when the person is not talking, the body can invite a 5-second voice note", "c": 30, "cn": "README: voice, vibration and the loop", "t": "concept", "f": "README.md", "r": "", "d": 2, "x": 1839.8, "y": -2072.3}, {"id": "readme_in_nightlets_terms", "l": "In Nightlet's terms: feel understood, not optimized; sits on any SOUL model, decides speak / ask / quiet and the bracelet pulse, learns on the phone without breaking 'never used for training'", "c": 30, "cn": "README: voice, vibration and the loop", "t": "rationale", "f": "README.md", "r": "", "d": 2, "x": 1632.5, "y": -2200.5}, {"id": "docs_21_text_face_incongruence_incongruence_score", "l": "Personal incongruence score (Jensen-Shannon divergence vs personal usual distance)", "c": 31, "cn": "README: voice and body", "t": "concept", "f": "docs/21-text-face-incongruence.md", "r": "", "d": 3, "x": 1836.0, "y": -1726.7}, {"id": "readme_enrollment", "l": "Enrollment (3-7 days): fixed sentences, resting physiology, sliders and one word; later the same sentence read in a clear state becomes the voice-and-body signature", "c": 31, "cn": "README: voice and body", "t": "concept", "f": "README.md", "r": "", "d": 5, "x": 1906.4, "y": -1746.0}, {"id": "readme_listening_well_open_speech_models", "l": "Listening well from day one: open speech models (words via Whisper, Parakeet, Handy, SenseVoice; voice via emotion2vec+, SenseVoice; on the phone, swappable); generic 0.62 -> 0.82+, calibration still adds +0.16 today, +0.08 with much stronger models; E31 ready to run", "c": 31, "cn": "README: voice and body", "t": "concept", "f": "README.md", "r": "", "d": 4, "x": 2169.7, "y": -1777.4}, {"id": "readme_tuning_pulse_per_person", "l": "Tuning the pulse to each person: heartbeat at 80% of the live heart rate (never above 90%); learned resonance breathing (4.5-7/min); live heartbeat 0.72 vs fixed 0.5 , "d": 3, "x": 1552.4, "y": 2617.4}, {"id": "engine_readme_signature_api", "l": "Voice-and-body signatures API: engine.enroll(x), engine.anchor(x), engine.tag('tense', x), then Reading(..., voice_features=x); the signature becomes the engine's voice channel", "c": 7, "cn": "Voice-and-body signatures", "t": "concept", "f": "engine/README.md", "r": "", "d": 5, "x": 1279.3, "y": 2271.6}, {"id": "readme_voice_body_one_reading", "l": "Voice and body end up in one reading: the signature is the engine's voice channel; full loop 0.41 (public approach) and 0.57 (engine without signature) -> 0.81; right when speaking 52% / 61% -> 88%", "c": 7, "cn": "Voice-and-body signatures", "t": "concept", "f": "README.md", "r": "", "d": 6, "x": 1351.3, "y": 2256.8}, {"id": "docs_29_voice_signatures_doc", "l": "29 — Your voice, your body, your signature: one fixed sentence, three uses", "c": 7, "cn": "Voice-and-body signatures", "t": "document", "f": "docs/29-voice-signatures.md", "r": "", "d": 49, "x": 1332.8, "y": 2317.8}, {"id": "engine_examples_anchors_doc", "l": "Personal voice-and-body signatures from a fixed sentence (synthetic people)", "c": 7, "cn": "Voice-and-body signatures", "t": "document", "f": "engine/examples/ANCHORS.md", "r": "", "d": 7, "x": 1483.5, "y": 2568.5}, {"id": "docs_02_enrollment_entry_calibration", "l": "Entry calibration (enrollment, 3-7 days)", "c": 7, "cn": "Voice-and-body signatures", "t": "rationale", "f": "docs/02-enrollment.md", "r": "User's own answers anchor first readings instead of trusting a generic model; one full calibration then only the 5-second anchor and a self-updating baseline", "d": 6, "x": 1128.5, "y": 2295.0}, {"id": "docs_03_session_anchor_session_anchor", "l": "Session anchor (one neutral sentence + resting HR)", "c": 7, "cn": "Voice-and-body signatures", "t": "rationale", "f": "docs/03-session-anchor.md", "r": "Same words each time so only the voice changes; daily comparison point for rolling baseline; equivalent to BCI between-session calibration", "d": 6, "x": 1121.8, "y": 2321.2}, {"id": "docs_29_voice_signatures_avoid_double_counting_body", "l": "Setting 3: the body is not counted twice: when the signature holds the body signals, the engine's own heart rate, HRV and temperature are left out for that reading (movement stays)", "c": 7, "cn": "Voice-and-body signatures", "t": "rationale", "f": "docs/29-voice-signatures.md", "r": "", "d": 5, "x": 1425.6, "y": 2371.7}, {"id": "docs_29_voice_signatures_engine_settings", "l": "Three settings, chosen in a synthetic check and confirmed on people not used to choose them", "c": 7, "cn": "Voice-and-body signatures", "t": "rationale", "f": "docs/29-voice-signatures.md", "r": "The first wiring without these settings made the engine worse (0.54 vs 0.60); the reason is recorded so the settings are not arbitrary.", "d": 6, "x": 1412.3, "y": 2300.6}, {"id": "docs_29_voice_signatures_first_wiring_worse", "l": "The first wiring, without the three settings, made the engine worse (0.54 vs 0.60)", "c": 7, "cn": "Voice-and-body signatures", "t": "rationale", "f": "docs/29-voice-signatures.md", "r": "", "d": 2, "x": 1401.5, "y": 2244.5}, {"id": "docs_29_voice_signatures_learning_by_person_not_rl", "l": "Learning by the person, not reinforcement learning: the person chooses when to read, the system shows the difference", "c": 7, "cn": "Voice-and-body signatures", "t": "rationale", "f": "docs/29-voice-signatures.md", "r": "", "d": 2, "x": 1329.9, "y": 2215.8}, {"id": "docs_29_voice_signatures_one_fixed_sentence_three_moments", "l": "One fixed sentence, three moments (enrollment, daily anchor, tagged reading)", "c": 7, "cn": "Voice-and-body signatures", "t": "rationale", "f": "docs/29-voice-signatures.md", "r": "", "d": 5, "x": 1245.5, "y": 2300.2}, {"id": "docs_29_voice_signatures_one_reading", "l": "Voice and body as one reading: the voice note's prosody and the bracelet's signals are one vector read against the person's own signatures, becoming the engine's voice channel", "c": 7, "cn": "Voice-and-body signatures", "t": "rationale", "f": "docs/29-voice-signatures.md", "r": "The goal of the device is one reading of the person's state; the signature does not add a second reading beside it.", "d": 4, "x": 1303.9, "y": 2308.6}, {"id": "docs_29_voice_signatures_person_learns_too", "l": "The person learns too: showing the signature back (\"when you're tense your voice gets faster and higher... heart rate rises by about 12\")", "c": 7, "cn": "Voice-and-body signatures", "t": "rationale", "f": "docs/29-voice-signatures.md", "r": "", "d": 8, "x": 1298.5, "y": 2253.2}, {"id": "docs_29_voice_signatures_personal_signature", "l": "Personal voice-and-body signature: difference between a state and the person's calm in pitch, energy, speech rate, pauses, voice quality, heart rate, HRV and skin temperature", "c": 7, "cn": "Voice-and-body signatures", "t": "rationale", "f": "docs/29-voice-signatures.md", "r": "Same words, so only the voice and the body differ; the system learns the person and the person learns themselves.", "d": 8, "x": 1244.6, "y": 2372.0}, {"id": "docs_29_voice_signatures_replaces_generic_voice", "l": "Setting 1: the signature replaces the generic voice model's reading instead of being added (both read the same voice; adding gave 0.65 instead of 0.81)", "c": 7, "cn": "Voice-and-body signatures", "t": "rationale", "f": "docs/29-voice-signatures.md", "r": "", "d": 6, "x": 1400.4, "y": 2349.5}, {"id": "docs_29_voice_signatures_softened_temperature4", "l": "Setting 2: the signature is softened (temperature 4) to the scale of the other channels; unsoftened its evidence is ~5x stronger, the engine speaks too often (87%) and is right less often (75%)", "c": 7, "cn": "Voice-and-body signatures", "t": "rationale", "f": "docs/29-voice-signatures.md", "r": "", "d": 4, "x": 1414.2, "y": 2330.9}, {"id": "docs_29_voice_signatures_two_tagged_readings_enough", "l": "Two tagged readings per state are enough (about eight sentences in the first     vb.x = cx - (cx - vb.x) * f; vb.y = cy - (cy - vb.y) * f; vb.w *= f; vb.h *= f; apply();
  }
  function fit() { vb = { x: full.x, y: full.y, w: full.w, h: full.h }; apply(); }
  function toSvg(px, py) {
    var r = svg.getBoundingClientRect(), s = Math.max(vb.w / r.width, vb.h / r.height);
    var ox = (r.width * s - vb.w) / 2, oy = (r.height * s - vb.h) / 2;
    return { x: vb.x - ox + (px - r.left) * s, y: vb.y - oy + (py - r.top) * s, s: s };
  }
  svg.addEventListener('wheel', function (ev) { ev.preventDefault(); var p = toSvg(ev.clientX, ev.clientY); zoom(ev.deltaY > 0 ? 1.15 : 1 / 1.15, p.x, p.y); }, { passive: false });
  var drag = null;
  svg.addEventListener('pointerdown', function (ev) { drag = { x: ev.clientX, y: ev.clientY, vx: vb.x, vy: vb.y, s: toSvg(ev.clientX, ev.clientY).s, moved: false }; svg.classList.add('dragging'); });
  window.addEventListener('pointermove', function (ev) { if (!drag) return; var dx = ev.clientX - drag.x, dy = ev.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true; vb.x = drag.vx - dx * drag.s; vb.y = drag.vy - dy * drag.s; apply(); });
  window.addEventListener('pointerup', function () { drag = null; svg.classList.remove('dragging'); });
  document.getElementById('zin').onclick = function () { zoom(1 / 1.4); };
  document.getElementById('zout').onclick = function () { zoom(1.4); };
  document.getElementById('fit').onclick = fit;
  document.getElementById('clear').onclick = function () { clearSel(); };
  svg.addEventListener('click', function () { if (drag === null) {} });

  // Legend
  var hidden = {};
  var legend = document.getElementById('legend');
  Object.keys(D.comms).sort(function (a, b) { return a - b; }).forEach(function (c) {
    var count = D.nodes.filter(function (n) { return String(n.c) === c; }).length;
    var row = document.createElement('div'); row.className = 'lg';
    var dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = color(+c);
    var label = document.createElement('span'); label.textContent = D.comms[c] + ' (' + count + ')';
    row.appendChild(dot); row.appendChild(label);
    row.onclick = function () { hidden[c] = !hidden[c]; row.classList.toggle('off', hidden[c]); refreshHidden(); };
    legend.appendChild(row);
  });
  function refreshHidden() {
    D.nodes.forEach(function (n) { nodeEls[n.id].classList.toggle('hidden', !!hidden[String(n.c)]); });
    D.edges.forEach(function (e, i) { edgeEls[i].classList.toggle('hidden', !!hidden[String(byId[e.s].c)] || !!hidden[String(byId[e.t].c)]); });
  }

  // Selection
  var info = document.getElementById('info');
  function clearSel() {
    Object.keys(nodeEls).forEach(function (id) { nodeEls[id].classList.remove('dim', 'sel'); });
    edgeEls.forEach(function (l) { l.classList.remove('dim', 'hl'); });
    intro();
  }
  function select(id) {
    var n = byId[id], near = {}; near[id] = true; adj[id].forEach(function (x) { near[x] = true; });
    Object.keys(nodeEls).forEach(function (k) { nodeEls[k].classList.toggle('dim', !near[k]); nodeEls[k].classList.toggle('sel', k === id); });
    D.edges.forEach(function (e, i) { var on = e.s === id || e.t === id; edgeEls[i].classList.toggle('dim', !on); edgeEls[i].classList.toggle('hl', on); });
    info.innerHTML = '';
    var h = document.createElement('h2'); h.textContent = n.l; info.appendChild(h);
    var m = document.createElement('div'); m.className = 'meta'; m.textContent = (D.comms[n.c] || '') + ' · ' + n.f + ' · ' + n.d + ' links'; info.appendChild(m);
    if (n.r) { var p = document.createElement('p'); p.textContent = n.r; info.appendChild(p); }
    var hy = D.hyper.filter(function (x) { return x.n.indexOf(id) >= 0; });
    if (hy.length) { var q = document.createElement('p'); q.className = 'hint'; q.textContent = 'Part of: ' + hy.map(function (x) { return x.l; }).join('; '); info.appendChild(q); }
    if (n.d <= 1 && n.t !== 'document') { var w = document.createElement('p'); w.style.color = 'var(--accent)'; w.textContent = 'Weakly connected: a possible gap in the project.'; info.appendChild(w); }
    var t = document.createElement('div'); t.className = 'hint'; t.textContent = 'Linked to:'; info.appendChild(t);
    var ul = document.createElement('ul');
    adj[id].map(function (x) { return byId[x]; }).sort(function (a, b) { return b.d - a.d; }).forEach(function (x) {
      var li = document.createElement('li'); li.textContent = x.l; li.onclick = function () { select(x.id); center(x.id); }; ul.appendChild(li);
    });
    info.appendChild(ul);
  }
  function center(id) { var n = byId[id]; vb.x = n.x - vb.w / 2; vb.y = n.y - vb.h / 2; apply(); }
  document.getElementById('q').addEventListener('input', function (ev) {
    var s = ev.target.value.trim().toLowerCase(); if (s.length < 2) return;
    var hit = sorted.filter(function (n) { return n.l.toLowerCase().indexOf(s) >= 0; })[0];
    if (hit) { if (vb.w > full.w * 0.5) zoom(0.45); select(hit.id); center(hit.id); }
  });
  function intro() {
    info.innerHTML = '';
    var p = document.createElement('p'); p.className = 'hint'; p.textContent = 'Most connected concepts (click to explore):'; info.appendChild(p);
    var ul = document.createElement('ul');
    sorted.filter(function (n) { return n.t !== 'document' && n.t !== 'code'; }).slice(0, 12).forEach(function (x) {
      var li = document.createElement('li'); li.textContent = x.l + ' (' + x.d + ')'; li.onclick = function () { select(x.id); }; ul.appendChild(li);
    });
    info.appendChild(ul);
  }
  apply(); intro();
  window.addEventListener('resize', apply);
})();
</script>
</body>
</html>
