[project]
name = "soulcal"
version = "0.1.0"
description = "SOUL-Calibrate engine: personal baseline, multimodal fusion, speak/ask/quiet with conformal sets, situation memory, words-vs-expression disagreement and a personal pattern graph."
authors = [{ name = "Emanuele De Bernardis", email = "emanuelepio.debernardis@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["soulcal"]

[tool.setuptools.package-data]
soulcal = ["data/*.json"]
